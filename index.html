<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Masuk — Sistem Persuratan</title>

<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

  <div class="login-card">

    <div class="login-mark">

      <div class="seal">SP</div>

      <div>
        <div class="name">Sistem Persuratan</div>
        <div class="sub">Template dokumen digital</div>
      </div>

    </div>


    <h1>Masuk</h1>

    <p class="lead">
      Gunakan akun yang diberikan admin untuk mengakses sistem.
    </p>


    <!-- PESAN ERROR -->
    <div id="formError" class="form-error"></div>


    <!-- FORM LOGIN -->
    <form id="loginForm" novalidate>

      <div class="field">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="btn btn-primary"
        id="loginBtn"
      >

        <span id="loginBtnText">
          Masuk
        </span>

      </button>

    </form>


    <!-- LUPA PASSWORD / USERNAME -->

    <p class="login-footnote">

      <a href="#" id="forgotPassword">
        Lupa password?
      </a>

      <br>

      <a href="#" id="forgotUsername">
        Lupa akun / username?
      </a>

    </p>


  </div>


  <!-- TOAST -->

  <div
    class="toast-stack"
    id="toastStack"
  ></div>


  <!-- FIREBASE -->

  <script
    type="module"
    src="js/firebase-config.js"
  ></script>


  <!-- LOGIN -->

  <script
    type="module"
    src="js/login.js"
  ></script>


</body>
</html>
