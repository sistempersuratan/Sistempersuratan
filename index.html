<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Sistem Persuratan</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-mark">
      <div class="seal">SP</div>
      <div>
        <div class="name">Sistem Persuratan</div>
        <div class="sub">Template dokumen digital</div>
      </div>
    </div>

    <h1>Masuk</h1>
    <p class="lead">Gunakan akun yang diberikan admin untuk mengakses sistem.</p>

    <div id="formError" class="form-error"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
   <div class="field">
        <label for="password">Password</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" id="password" name="password" autocomplete="current-password" required style="width: 100%; padding-right: 45px; box-sizing: border-box;">
          <span id="togglePassword" style="position: absolute; right: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: #666;" title="Lihat password">
            <!-- Ikon Mata SVG (Default: Tertutup / Garis) -->
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span id="loginBtnText">Masuk</span>
      </button>
    </form>

    <p class="login-footnote">
      <a href="#" id="forgotPasswordLink" style="color: inherit; text-decoration: underline;">Lupa password? Klik di sini</a>
    </p>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
