<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Sistem Persuratan</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">SP</div>
        <div class="name">Persuratan</div>
      </div>

      <nav class="nav-group">
        <a class="nav-link active" href="admin.html">Dashboard</a>
        <a class="nav-link" href="pages/users.html">Kelola User</a>
        <a class="nav-link" href="pages/templates.html">Kelola Template</a>
        <a class="nav-link" href="pages/documents.html">Semua Dokumen</a>
        <a class="nav-link" href="pages/settings.html">Pengaturan</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="userInitial">?</div>
          <div class="who">
            <div class="n" id="userName">Memuat...</div>
            <div class="r"><span class="badge admin">Admin</span></div>
          </div>
        </div>
        <button class="nav-link" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1 id="greeting">Dashboard Admin</h1>
          <div class="subtitle">Ringkasan seluruh sistem persuratan.</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Total User</div>
          <div class="value" id="statUsers">–</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Template</div>
          <div class="value" id="statTemplates">–</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Dokumen</div>
          <div class="value" id="statDocs">–</div>
        </div>
        <div class="stat-card">
          <div class="label">Dokumen Hari Ini</div>
          <div class="value" id="statDocsToday">–</div>
        </div>
      </div>

      <div class="panel">
        <div class="empty-state">
          <div class="glyph">SP</div>
          <p>Kelola User &amp; Template akan aktif pada STEP 2–3.</p>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
