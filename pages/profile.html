<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">SP</div>
        <div class="name">Persuratan</div>
      </div>

      <nav class="nav-group">
        <a class="nav-link nav-dashboard-link" href="../dashboard.html">Dashboard</a>
        <a class="nav-link" href="create-document.html">Buat Dokumen</a>
        <a class="nav-link" href="documents.html">Dokumen Saya</a>
        <a class="nav-link admin-only" href="users.html" style="display:none;">Kelola User</a>
        <a class="nav-link admin-only" href="templates.html" style="display:none;">Kelola Template</a>
        <a class="nav-link active" href="profile.html">Profil</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="userInitial">?</div>
          <div class="who">
            <div class="n" id="userName">Memuat...</div>
            <div class="r"><span class="badge" id="userRoleBadge">User</span></div>
          </div>
        </div>
        <button class="nav-link js-logout" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1>Profil</h1>
          <div class="subtitle">Informasi akun dan keamanan.</div>
        </div>
        <button class="btn-header-logout js-logout" type="button">Keluar</button>
      </div>

      <div class="panel" style="max-width:480px; margin-bottom:16px;">
        <h3 style="margin-bottom:14px;">Informasi Akun</h3>
        <div class="field">
          <label for="infoUsername">Username</label>
          <input type="text" id="infoUsername" readonly>
        </div>
        <div class="field">
          <label for="infoEmail">Email</label>
          <input type="text" id="infoEmail" readonly>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="infoRole">Peran</label>
          <input type="text" id="infoRole" readonly>
        </div>
      </div>

      <div class="panel" style="max-width:480px;">
        <h3 style="margin-bottom:14px;">Ubah Password</h3>
        <div id="passwordError" class="form-error"></div>
        <form id="passwordForm" novalidate>
          <div class="field">
            <label for="currentPassword">Password saat ini</label>
            <input type="password" id="currentPassword" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="newPassword">Password baru</label>
            <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
            <div class="field-hint">Minimal 6 karakter.</div>
          </div>
          <div class="field">
            <label for="confirmPassword">Ulangi password baru</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-primary" id="savePasswordBtn" style="width:auto; padding:11px 20px;">Simpan Password</button>
        </form>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a class="nav-link nav-dashboard-link" href="../dashboard.html">Dashboard</a>
    <a class="nav-link" href="create-document.html">Buat</a>
    <a class="nav-link" href="documents.html">Dokumen</a>
    <a class="nav-link admin-only" href="users.html" style="display:none;">User</a>
    <a class="nav-link admin-only" href="templates.html" style="display:none;">Template</a>
    <a class="nav-link active" href="profile.html">Profil</a>
  </nav>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
