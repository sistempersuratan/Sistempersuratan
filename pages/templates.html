<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenis Dokumen — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">

</head>

<body data-nav="admin" data-nav-active="types">

  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1>Jenis Dokumen</h1>

        </div>
        <a class="btn btn-primary" href="template-editor.html" style="width:auto; padding:9px 16px; text-decoration:none; display:inline-flex; align-items:center;">+ Jenis Dokumen Baru</a>
      </div>

      <div class="panel" style="padding:0; overflow-x:auto;">

          <thead>
            <tr>
              <th>Nama Jenis Dokumen</th>
              <th>Kategori</th>
              <th>Jumlah Field</th>
              <th>Status</th>

          </thead>
          <tbody id="templatesTableBody">
            <tr><td colspan="4" class="table-empty">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="appBottomNav"></nav>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="../js/nav.js"></script>
