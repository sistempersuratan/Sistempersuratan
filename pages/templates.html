<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Template — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">SP</div>
        <div class="name">Persuratan</div>
      </div>

      <nav class="nav-group">
        <a class="nav-link" href="../admin.html">Dashboard</a>
        <a class="nav-link" href="users.html">Kelola User</a>
        <a class="nav-link active" href="templates.html">Kelola Template</a>
        <a class="nav-link" href="documents.html">Semua Dokumen</a>
        <a class="nav-link" href="settings.html">Pengaturan</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="userInitial">?</div>
          <div class="who">
            <div class="n" id="userName">Memuat...</div>
            <div class="r"><span class="badge admin">Admin</span></div>
          </div>
        </div>
        <button class="nav-link js-logout" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1>Kelola Template</h1>
          <div class="subtitle">Template dokumen yang bisa dipakai user membuat surat.</div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-header-logout js-logout" type="button">Keluar</button>
          <a class="btn btn-primary" href="template-editor.html" style="width:auto; padding:9px 16px; text-decoration:none; display:inline-flex; align-items:center;">+ Template Baru</a>
        </div>
      </div>

      <div class="panel" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="templatesTable">
          <thead>
            <tr>
              <th>Nama Template</th>
              <th>Kategori</th>
              <th>Jumlah Field</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="templatesTableBody">
            <tr><td colspan="5" class="table-empty">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/templates.js"></script>
</body>
</html>
