<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola User — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">SP</div>
        <div class="name">Persuratan</div>
      </div>

      <nav class="nav-group">
        <a class="nav-link" href="../admin.html">Dashboard</a>
        <a class="nav-link active" href="users.html">Kelola User</a>
        <a class="nav-link" href="templates.html">Kelola Template</a>
        <a class="nav-link" href="documents.html">Semua Dokumen</a>
        <a class="nav-link" href="settings.html">Pengaturan</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="userInitial">?</div>
          <div class="who">
            <div class="n" id="userName">Memuat...</div>
            <div class="r"><span class="badge admin">Admin</span></div>
          </div>
        </div>
        <button class="nav-link js-logout" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1>Kelola User</h1>
          <div class="subtitle">Tambah, ubah, atau nonaktifkan akun pengguna.</div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-header-logout js-logout" type="button">Keluar</button>
          <button class="btn btn-primary" id="openAddUserBtn" style="width:auto; padding:9px 16px;">+ Tambah User</button>
        </div>
      </div>

      <div class="panel" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="usersTable">
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" class="table-empty">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- MODAL TAMBAH/EDIT USER -->
  <div class="modal-overlay" id="userModalOverlay">
    <div class="modal-card">
      <h2 id="userModalTitle">Tambah User</h2>

      <div id="userFormError" class="form-error"></div>

      <form id="userForm" novalidate>
        <input type="hidden" id="userDocId" value="">

        <div class="field">
          <label for="fUsername">Username</label>
          <input type="text" id="fUsername" required>
        </div>

        <div class="field" id="emailField">
          <label for="fEmail">Email</label>
          <input type="email" id="fEmail" required>
        </div>

        <div class="field" id="passwordField">
          <label for="fPassword">Password</label>
          <input type="password" id="fPassword" minlength="6">
          <div class="field-hint">Minimal 6 karakter.</div>
        </div>

        <div class="field">
          <label for="fRole">Role</label>
          <select id="fRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelUserBtn">Batal</button>
          <button type="submit" class="btn btn-primary" id="saveUserBtn" style="width:auto; padding:11px 20px;">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/users.js"></script>
</body>
</html>
