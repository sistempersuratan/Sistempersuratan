<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Dokumen — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/template-editor.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">SP</div>
        <div class="name">Persuratan</div>
      </div>

      <nav class="nav-group">
        <a class="nav-link" id="navDashboard" href="../dashboard.html">Dashboard</a>
        <a class="nav-link active" href="create-document.html">Buat Dokumen</a>
        <a class="nav-link" href="documents.html">Dokumen Saya</a>
        <a class="nav-link admin-only" href="users.html" style="display:none;">Kelola User</a>
        <a class="nav-link admin-only" href="templates.html" style="display:none;">Kelola Template</a>
        <a class="nav-link" href="settings.html">Pengaturan</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="userInitial">?</div>
          <div class="who">
            <div class="n" id="userName">Memuat...</div>
            <div class="r"><span class="badge" id="userRoleBadge">User</span></div>
          </div>
        </div>
        <button class="nav-link js-logout" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1>Buat Dokumen</h1>
          <div class="subtitle">Pilih template, isi data, lalu simpan dokumennya.</div>
        </div>
        <button class="btn-header-logout js-logout" type="button">Keluar</button>
      </div>

      <div class="panel">
        <label for="templateSelect" style="display:block; font-weight:600; margin-bottom:6px;">Pilih Template</label>
        <select id="templateSelect" class="input" style="max-width:420px;">
          <option value="">— Memuat daftar template —</option>
        </select>
      </div>

      <div class="panel" id="formPanel" style="display:none; margin-top:16px;">
        <h3 id="formTitle">Isi Data</h3>
        <p class="subtitle" id="formDescription"></p>
        <form id="documentForm"></form>

       <div style="display:flex; gap:8px; flex-wrap:wrap;">
  <button class="btn" id="printBtn">Cetak</button>
  <button class="btn" id="downloadPdfBtn">Download PDF</button>
  <button class="btn" id="downloadWordBtn">Download Word</button>
  <button class="btn" id="shareWaBtn">Kirim WA</button>
  <button class="btn" id="shareEmailBtn">Kirim Email</button>
  <button class="btn btn-primary" id="submitBtn" style="display:none;">Ajukan Rilis</button>
  <button class="btn btn-primary admin-only" id="releaseBtn" style="display:none;">Setujui & Rilis</button>
  <button class="btn admin-only" id="rejectBtn" style="display:none;">Tolak</button>
</div>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/create-document.js"></script>
</body>
</html>
