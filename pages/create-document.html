<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Dokumen — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/template-editor.css">
</head>
<body data-nav="shared" data-nav-active="create">

  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1 id="pageTitle">Buat Dokumen</h1>
          <div class="subtitle" id="pageSubtitle">Pilih jenis dokumen, isi data, lalu simpan dokumennya.</div>
        </div>
        <button class="btn-header-logout js-logout" type="button">Keluar</button>
      </div>

      <div class="panel">
        <label for="templateSelect" style="display:block; font-weight:600; margin-bottom:6px;">Pilih Jenis Dokumen</label>
        <select id="templateSelect" class="input" style="max-width:420px;">
          <option value="">— Memuat daftar jenis dokumen —</option>
        </select>
      </div>

      <div class="panel" id="formPanel" style="display:none; margin-top:16px;">
        <h3 id="formTitle">Isi Data</h3>
        <p class="subtitle" id="formDescription"></p>
        <form id="documentForm"></form>

        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="button" class="btn" id="previewBtn">Pratinjau</button>
          <button type="button" class="btn btn-primary" id="saveBtn">Simpan Dokumen</button>
        </div>
      </div>

      <div class="panel" id="previewPanel" style="display:none; margin-top:16px;">
        <h3>Pratinjau</h3>
        <div id="previewArea" style="border:1px solid #e2e2e2; padding:24px; background:#fff; min-height:200px;"></div>
      </div>
    </main>
  </div>


  <nav class="bottom-nav" id="appBottomNav"></nav>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/create-document.js"></script>
</body>
</html>
