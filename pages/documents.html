<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokumen — Sistem Persuratan</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-nav="shared" data-nav-active="documents">

  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h1 id="pageTitle">Arsip Dokumen</h1>
          <div class="subtitle" id="pageSubtitle">Klik salah satu dokumen untuk melihat isi atau mengekspornya.</div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn admin-only" id="exportExcelBtn" style="display:none; width:auto;">Export Rekap Excel</button>
          <button class="btn-header-logout js-logout" type="button">Keluar</button>
        </div>
      </div>

      <div class="filter-bar">
        <input type="search" id="searchInput" class="input" placeholder="Cari nomor surat, jenis dokumen, atau pembuat..." style="flex:1; min-width:200px;">
        <select id="statusFilter" class="input" style="width:auto;">
          <option value="">Semua status</option>
          <option value="draft">Draft</option>
          <option value="pending">Menunggu Persetujuan</option>
          <option value="released">Rilis</option>
        </select>
        <select id="sortSelect" class="input" style="width:auto;">
          <option value="newest">Terbaru dulu</option>
          <option value="oldest">Terlama dulu</option>
        </select>
      </div>

      <div class="panel" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="documentsTable">
          <thead>
            <tr>
              <th>Nomor Surat</th>
              <th>Jenis Dokumen</th>
              <th>Tanggal Dibuat</th>
              <th class="admin-only" style="display:none;">Dibuat Oleh</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="documentsTableBody">
            <tr><td colspan="6" class="table-empty">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="reader" id="detailPanel" style="display:none;">
        <div class="reader-bar">
          <button class="btn btn-sm" id="readerBack" type="button">&larr; Kembali</button>
          <div class="reader-title">
            <strong id="detailTitle">Detail Dokumen</strong>
            <div class="reader-meta" id="detailMeta"></div>
          </div>
          <div class="reader-actions">
            <button class="btn btn-sm" id="editBtn" style="display:none;">Edit</button>
            <button class="btn btn-sm" id="deleteBtn" style="display:none; color:var(--accent);">Hapus</button>
            <button class="btn btn-primary btn-sm" id="submitBtn" style="display:none;">Ajukan Rilis</button>
            <button class="btn btn-primary btn-sm admin-only" id="releaseBtn" style="display:none;">Setujui &amp; Rilis</button>
            <button class="btn btn-sm admin-only" id="rejectBtn" style="display:none;">Tolak</button>
            <div class="export-wrap">
              <button class="btn btn-sm" id="exportToggle" type="button" aria-haspopup="true" aria-expanded="false">Ekspor &#9662;</button>
              <div class="export-menu" id="exportMenu" role="menu">
                <div class="menu-label">Download</div>
                <button class="menu-item" id="downloadPdfBtn" type="button" role="menuitem">PDF</button>
                <button class="menu-item" id="downloadWordBtn" type="button" role="menuitem">Word (.doc)</button>
                <button class="menu-item" id="printBtn" type="button" role="menuitem">Cetak</button>
                <div class="menu-label">Kirim</div>
                <button class="menu-item" id="shareWaBtn" type="button" role="menuitem">WhatsApp</button>
                <button class="menu-item" id="shareEmailBtn" type="button" role="menuitem">Email</button>
              </div>
            </div>
          </div>
        </div>
        <div class="reader-stage">
          <article class="paper" id="detailPreview"></article>
        </div>
      </div>
    </main>
  </div>


  <div class="modal-overlay" id="releaseOverlay">
    <div class="modal-box wide">
      <h2 style="margin:0 0 2px 0;">Terbitkan Dokumen</h2>
      <div class="subtitle" id="releaseSub"></div>
      <div id="releaseOptions" style="display:grid; gap:10px; margin-top:14px;"></div>
      <div id="releaseWarn" style="margin-top:10px;"></div>
      <div class="field-hint" style="margin-top:12px;">Pratinjau hasil akhir (nomor surat diberikan otomatis saat diterbitkan):</div>
      <div id="releasePreview" style="border:1px solid #e2e2e2; background:#fff; padding:24px; margin-top:6px; max-height:46vh; overflow:auto;"></div>
      <div class="modal-actions">
        <button class="btn btn-sm" id="releaseCancel" type="button">Batal</button>
        <button class="btn btn-primary btn-sm" id="releaseConfirm" type="button" disabled>Terbitkan</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="appBottomNav"></nav>

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/documents.js"></script>
</body>
</html>
